<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>🍊</text></svg>">
    <title>OSCM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <meta name="description" content="The open source capital management company">
    <style>
        body {
            font-family: 'Libre Baskerville', serif;
            background-color: #ff9900;
            color: #ffffff;
            margin: 0;
        }

        a {
            color: #ffffff;
        }

        .container {
            box-sizing: border-box;
            max-width: 34rem;
            margin: auto;
            padding: 3rem 1rem;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            margin: 0 0 4rem;
        }

        .title {
            font-size: 3rem;
            font-weight: 400;
            margin: 0 0 2rem;
        }

        nav {
            font-size: 1.5rem;
        }

        @media screen and (max-width: 580px) {
            .logo {
                margin-bottom: 2rem;
            }

            .title {
                font-size: 2.5rem;
            }
        }

        @media screen and (max-width: 359px) {
            nav a {
                display: block;
                margin-bottom: 0.5rem;
            }

            .separator {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">OSCM</div>
        <h1 class="title">The open source capital management company</h1>
        <nav>
            <a href="https://github.com/oscmcompany" target="_blank">GitHub</a> <span class="separator">|</span>
            <a href="https://twitter.com/oscmcompany" target="_blank">Twitter</a> <span class="separator">|</span>
            <a href="mailto:team@oscm.company">Email</a>
        </nav>
    </div>
</body>
</html>
